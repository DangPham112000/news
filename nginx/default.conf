server {
    listen 80;
    server_name _;   # domain routing is done by the host nginx

    # Docker's embedded DNS. Resolving per request keeps /graphql working
    # after the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy GraphQL requests to the backend
    location /graphql {
        set $backend http://backend:4000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # MCP endpoint for AI agents (Streamable HTTP, JSON responses).
    location = /mcp {
        set $backend http://backend:4000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
