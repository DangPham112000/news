name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: backend-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: frontend-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The publishable key lives in Doppler (project news, config prd).
      # `doppler secrets get` fails the job if the token or the key is missing,
      # so a build without sign-in never ships.
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load build-time keys from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::Set the DOPPLER_TOKEN repository secret (a read-only service token for news/prd)."
            exit 1
          fi
          # Doppler keeps one variable that references the shared Clerk app, and the
          # build gets it under its VITE_ name. A VITE_ copy in Doppler would be a
          # chained reference, which Doppler does not allow.
          KEY=$(doppler secrets get CLERK_PUBLISHABLE_KEY --plain)
          echo "VITE_CLERK_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          # The publishable key is public; Vite inlines it into the bundle.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vps-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose and nginx config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          # These secrets are configured in GitHub repo Settings → Secrets.
          # The linter cannot verify them statically, so we suppress the warnings.
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "/opt/news"

      - name: Deploy and Restart Services on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          # These secrets are configured in GitHub repo Settings → Secrets.
          # The linter cannot verify them statically, so we suppress the warnings.
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_REPOSITORY
          script: |
            set -e
            cd /opt/news

            # Image names on GHCR must be lowercase (repo is DangPham112000/news)
            export IMAGE_PREFIX=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

            # Keep registry credentials in this project only, so the login does not
            # overwrite the docker config other stacks on the VPS rely on.
            export DOCKER_CONFIG=/opt/news/.docker
            mkdir -p "$DOCKER_CONFIG"
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Runtime secrets come from Doppler. The VPS deploy user has a read-only
            # service token scoped to /opt/news (doppler configure set token
            # --scope /opt/news). Stop here if it is missing, rather than
            # starting a backend without its Clerk keys.
            if ! doppler secrets get CLERK_SECRET_KEY --plain > /dev/null; then
              echo "Doppler is not set up for /opt/news on this VPS user." >&2
              exit 1
            fi

            # Pull new images
            docker compose pull

            # Restart services with the secrets from Doppler in the environment,
            # where docker compose fills in ${CLERK_SECRET_KEY} and the rest.
            doppler run -- docker compose up -d --remove-orphans

            # Prune dangling unused images (preserves layer cache for fast future pulls)
            docker image prune -f
