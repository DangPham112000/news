# Fixed project name: containers, network and volume get a "news" prefix,
# so nothing collides with other stacks running on the same VPS.
name: news

services:
  frontend:
    image: ghcr.io/${IMAGE_PREFIX}/frontend:latest
    restart: unless-stopped
    ports:
      # Only the VPS itself can reach this port (8080 Event Manager, 8081 Journei,
      # 8083 Bill Splitter). The host nginx serves
      # news.<domain> on 80 and proxies here.
      - "127.0.0.1:${APP_PORT:-8082}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    image: ghcr.io/${IMAGE_PREFIX}/backend:latest
    restart: unless-stopped
    environment:
      - PORT=4000
      # Shared MongoDB (ecosystem-infra, DAN-90): own Mongo user, own database.
      # MONGO_PASSWORD comes from Doppler news/prd via `doppler run`.
      - MONGODB_URI=mongodb://news:${MONGO_PASSWORD:?MONGO_PASSWORD is not set}@ecosystem-mongo:27017/news?authSource=admin
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-60}
      # Shared Clerk app (yolo-ecosystem), from Doppler news/prd via `doppler run`.
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-https://news.dantepham.site}
    networks:
      - default
      - ecosystem
    # No published port: the frontend nginx reaches it over the internal network.

networks:
  # Created by the shared Mongo stack in ecosystem-infra; deploy that first.
  ecosystem:
    external: true
