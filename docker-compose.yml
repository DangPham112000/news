# Fixed project name: containers, network and volume get a "news" prefix,
# so nothing collides with other stacks running on the same VPS.
name: news

services:
  frontend:
    image: ghcr.io/${IMAGE_PREFIX}/frontend:latest
    restart: unless-stopped
    ports:
      # Only the VPS itself can reach this port. The host nginx serves
      # news.<domain> on 80 and proxies here.
      - "127.0.0.1:${APP_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    image: ghcr.io/${IMAGE_PREFIX}/backend:latest
    restart: unless-stopped
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/news
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-60}
      # Shared Clerk app (yolo-ecosystem), from Doppler news/prd via `doppler run`.
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-https://news.dantepham.site}
    depends_on:
      - mongodb
    # No published port: the frontend nginx reaches it over the internal network.

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    # No published port: MongoDB has no auth, so it must never be public.

volumes:
  mongodb_data:
